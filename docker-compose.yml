services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-flota}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-flota-dev-password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      target: prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USER:-flota}:${MONGO_PASSWORD:-flota-dev-password}@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-flota}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-cambiar-este-secreto}
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8000}:8000"

  # Pruebas contra un MongoDB real: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-flota}:${MONGO_PASSWORD:-flota-dev-password}@mongo:27017/?authSource=admin
      MONGO_DB: flota_test
      GATEWAY_SECRET: test-secret
      SEED_ON_EMPTY: "false"
      LOG_LEVEL: warning

volumes:
  mongo_data:
