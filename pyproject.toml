[project]
name = "api-flota"
version = "1.0.0"
description = "CRUD de vehículos (scooters y bicicletas) del clúster Rodar, grupo Flota"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pymongo>=4.20,<5",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.5,<2",
    "asgi-lifespan>=2.1,<3",
    "shapely>=2.1",
]

[tool.uv]
# Es una aplicación, no una librería instalable.
package = false
