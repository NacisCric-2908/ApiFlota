name: CI

# Corre en cada pull request y en cada push a develop. No usa secretos: también es seguro con PR de forks.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  # El nombre del job es el que se marca como «check requerido» en las reglas de rama.
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas (MongoDB real, sin salir a internet)
        run: make test

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar las plantillas de Bicep
        run: |
          for f in infra/plataforma.bicep infra/app.bicep; do
            docker run --rm -v "$PWD:/w" -w /w mcr.microsoft.com/azure-cli az bicep build --file "$f" --stdout > /dev/null
          done
